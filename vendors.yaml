# vendors.yaml — the single source of truth for OEM slugs + their product axes.
#
# Every 2nd-level directory under skills/<domain>/ and every `oem` tag in a
# SKILL.md MUST be a slug registered here, and the directory's parent domain
# MUST be one of the slug's registered `domains`. CI (tools/gen-catalog.mjs and
# tools/validate-skill.mjs) enforces this. The `products` list enumerates the
# axes usable in a skill's `compatibility` string (e.g. fortios>=7.2).
#
# Slug discipline: ONE canonical token per OEM. Never let `paloalto` also appear
# as `palo-alto` or `pan`. Distinct hardware/server lines that collide with a
# networking vendor get their own slug (e.g. `cisco-ucs` is separate from
# `cisco`) — see design §5.4.

# --- network / security vendors ---
cisco:
  display: "Cisco"
  domains: [network, security]
  products: [ios-xe, nx-os, asa, ftd]
juniper:
  display: "Juniper Networks"
  domains: [network]
  products: [junos]
fortinet:
  display: "Fortinet"
  domains: [network, security]
  products: [fortios, fortimanager, fortianalyzer]
  aliases: [forti, fortigate]
arista:
  display: "Arista Networks"
  domains: [network]
  products: [eos]
paloalto:
  display: "Palo Alto Networks"
  domains: [security, network]
  products: [panos, panorama]
  aliases: [pan, palo-alto, palo, panw]
crowdstrike:
  display: "CrowdStrike"
  domains: [security]
  products: [falcon]
okta:
  display: "Okta"
  domains: [security]
  products: [okta]

